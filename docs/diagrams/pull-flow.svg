<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 556" width="1040" height="556" role="img" aria-label="Receiving changes: the pull path - An ordered log replayed from wherever this device left off" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>Receiving changes: the pull path - An ordered log replayed from wherever this device left off</title>
<rect width="1040" height="556" fill="#FFFFFF"/>
<text x="24" y="38" font-size="18" font-weight="700" fill="#1D2330">Receiving changes: the pull path</text>
<text x="24" y="60" font-size="13" fill="#5C6573">An ordered log replayed from wherever this device left off</text>
<g transform="translate(0,84)">
<path d="M250,103.5 L267.5,103.5 Q270,103.5 270,101 L270,101 Q270,98.5 272.5,98.5 L282,98.5" fill="none" stroke="#7D8796" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
