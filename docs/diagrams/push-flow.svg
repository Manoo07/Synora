<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 712" width="1040" height="712" role="img" aria-label="Saving a note: the push path - Encrypted and written to disk before any network call" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>Saving a note: the push path - Encrypted and written to disk before any network call</title>
<rect width="1040" height="712" fill="#FFFFFF"/>
<text x="24" y="38" font-size="18" font-weight="700" fill="#1D2330">Saving a note: the push path</text>
<text x="24" y="60" font-size="13" fill="#5C6573">Encrypted and written to disk before any network call</text>
<g transform="translate(0,84)">
