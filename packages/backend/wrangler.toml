name = "synora-backend"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Storage reclamation, daily. Nothing else removes superseded file
# versions, so without this an account's usage only ever climbs - every
# save writes a whole new encrypted copy, and deleting a file adds one
# rather than freeing any. See src/gc.ts.
#
# HELD until a dry run has been read against real data: everything
# already past the retention window becomes collectable on the very
# first run, and deletion has no undo. `npm run gc:dry-run` reports
# what it would remove. Uncomment to arm it.
# [triggers]
# crons = ["17 3 * * *"]

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "synora-bucket"

# `id` is the real production Hyperdrive config (points at the hosted
# Aiven Postgres instance). `localConnectionString` is only used by
# `wrangler dev`, which still talks to the local docker-compose Postgres
# instead - see docker-compose.yml.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "fbf0fa17c44b4a50a0c64a9e1e7f4081"
localConnectionString = "postgres://synora:synora@localhost:5435/synora"

# JWT_SECRET is set as a real secret (`wrangler secret put JWT_SECRET`),
# not a [vars] entry - a binding can't be both.

# 80% of Cloudflare's free-tier R2 storage allowance (10GB) - leaves
# headroom so a burst of signups can never push past the free tier before
# there's a billing story. See context.ts GLOBAL_STORAGE_CEILING_BYTES and
# routes/auth.ts.
[vars]
GLOBAL_STORAGE_CEILING_BYTES = 8000000000

# Rate limiting on /v1/auth/register and /v1/auth/login is implemented in
# code (src/auth/rate-limit.ts), serialized per-IP via a Postgres advisory
# lock - no extra binding needed here. Two earlier in-Worker approaches (a
# KV counter, then the `[[unsafe.bindings]]` ratelimit type) were both
# confirmed live to silently let every request through under concurrent
# load; this one is covered by a concurrency test (test/auth.test.ts)
# that proves it actually blocks.
