name = "synora-backend"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "synora-bucket"

# `id` is the real production Hyperdrive config (points at the hosted
# Aiven Postgres instance). `localConnectionString` is only used by
# `wrangler dev`, which still talks to the local docker-compose Postgres
# instead - see docker-compose.yml.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "fbf0fa17c44b4a50a0c64a9e1e7f4081"
localConnectionString = "postgres://synora:synora@localhost:5435/synora"

# JWT_SECRET is set as a real secret (`wrangler secret put JWT_SECRET`),
# not a [vars] entry - a binding can't be both.

# Rate limiting on /v1/auth/register and /v1/auth/login is NOT done here
# in code - two different in-Worker approaches (a KV counter, then the
# `[[unsafe.bindings]]` ratelimit type) were both tried and confirmed
# live to silently let every request through regardless of volume. It's
# configured instead as a Cloudflare dashboard WAF Rate Limiting Rule
# (Security -> WAF -> Rate limiting rules), which enforces at the edge
# before the request reaches this Worker at all - see README.md.
