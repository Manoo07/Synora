name = "synora-backend"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "synora-bucket"

# `id` is the real production Hyperdrive config (points at the hosted
# Aiven Postgres instance). `localConnectionString` is only used by
# `wrangler dev`, which still talks to the local docker-compose Postgres
# instead - see docker-compose.yml.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "fbf0fa17c44b4a50a0c64a9e1e7f4081"
localConnectionString = "postgres://synora:synora@localhost:5435/synora"

# JWT_SECRET is set as a real secret (`wrangler secret put JWT_SECRET`),
# not a [vars] entry - a binding can't be both.

# Rate-limits the unauthenticated auth endpoints by IP - see
# auth/rate-limit.ts. Cloudflare's purpose-built Rate Limiting binding,
# not KV: plain KV is eventually-consistent (a write isn't reliably
# visible to the very next request), which made an earlier KV-counter
# attempt here do nothing under rapid-fire requests - confirmed live,
# 12/12 requests succeeded against an intended limit of 10. This binding
# only takes one fixed limit/period per declaration, hence two of them;
# `period` only allows 10 or 60 (seconds) - no arbitrary window length.
[[unsafe.bindings]]
name = "RATE_LIMIT_REGISTER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[unsafe.bindings]]
name = "RATE_LIMIT_LOGIN"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 20, period = 60 }
