name: Keep database alive

# Runs independently of any local machine or Claude session - this is the
# whole point: a heartbeat query every 12 hours so the hosted Postgres
# instance is never idle long enough to be auto-paused. Off the :00 mark
# so this doesn't land on the same minute as everyone else's "every 12h"
# cron jobs.
on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run db:ping
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
